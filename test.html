<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Launching App...</title>
</head>
<body>
    <script>
        // Forces Android to open the native app package directly
        window.location.href = "intent://#Intent;scheme=xfinitystream;package=com.xfinity.cloudtvr;end;";
        
        // Fallback to play store if they don't have it after 2 seconds
        setTimeout(function() {
            window.location.href = "https://play.google.com/store/apps/details?id=com.xfinity.cloudtvr";
        }, 2000);
    </script>
</body>
</html>
